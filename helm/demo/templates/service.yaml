apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}
  labels:
    app: {{ .Release.Name }}
  annotations:
    # sans cette annotation, le load balancer Azure sonde "/" (404) et marque les pods HS
    service.beta.kubernetes.io/azure-load-balancer-health-probe-request-path: /actuator/health/readiness
spec:
  type: LoadBalancer
  selector:
    app: {{ .Release.Name }}
  ports:
    - name: http
      port: 80
      targetPort: http
