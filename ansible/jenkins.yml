- hosts: jenkins
  become: true
  tasks:
    - name: Paquets de base (Java 21, Maven, Docker)
      apt:
        name: [ca-certificates, curl, gnupg, fontconfig, openjdk-21-jdk, maven, git, docker.io, jq]
        state: present
        update_cache: true

    - name: Dossier des cles apt
      file:
        path: /etc/apt/keyrings
        state: directory
        mode: "0755"

    - name: Cle du depot Jenkins
      get_url:
        url: https://pkg.jenkins.io/debian-stable/jenkins.io-2026.key
        dest: /etc/apt/keyrings/jenkins-keyring.asc
        mode: "0644"

    - name: Depot Jenkins
      apt_repository:
        repo: "deb [signed-by=/etc/apt/keyrings/jenkins-keyring.asc] https://pkg.jenkins.io/debian-stable binary/"
        filename: jenkins

    - name: Installer Jenkins
      apt:
        name: jenkins
        update_cache: true

    - name: Azure CLI
      shell: curl -sL https://aka.ms/InstallAzureCLIDeb | bash
      args: { creates: /usr/bin/az }

    - name: kubectl
      command: az aks install-cli
      args: { creates: /usr/local/bin/kubectl }

    - name: Helm
      shell: curl -fsSL https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash
      args: { creates: /usr/local/bin/helm }

    - name: Trivy
      shell: curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin
      args: { creates: /usr/local/bin/trivy }

    - name: Jenkins dans le groupe docker
      user: { name: jenkins, groups: docker, append: true }

    - name: Services actifs (Jenkins redemarre pour prendre le groupe docker)
      systemd: { name: "{{ item }}", state: restarted, enabled: true }
      loop: [docker, jenkins]

    - name: Attendre le mot de passe initial
      wait_for: { path: /var/lib/jenkins/secrets/initialAdminPassword, timeout: 180 }

    - name: Lire le mot de passe initial
      command: cat /var/lib/jenkins/secrets/initialAdminPassword
      register: pwd
      changed_when: false

    - name: Afficher le mot de passe
      debug:
        msg: "Mot de passe initial Jenkins : {{ pwd.stdout }}"
