# Elasticsearch (1 noeud, sans securite : acces interne au cluster) et Kibana
apiVersion: apps/v1
kind: Deployment
metadata: { name: elasticsearch, namespace: logging }
spec:
  replicas: 1
  selector: { matchLabels: { app: elasticsearch } }
  template:
    metadata: { labels: { app: elasticsearch } }
    spec:
      containers:
        - name: elasticsearch
          image: docker.elastic.co/elasticsearch/elasticsearch:8.19.0
          env:
            - { name: discovery.type, value: single-node }
            - { name: xpack.security.enabled, value: "false" }
            - { name: node.store.allow_mmap, value: "false" }
            - { name: ES_JAVA_OPTS, value: "-Xms512m -Xmx512m" }
          ports: [{ containerPort: 9200 }]
          resources: { requests: { memory: 1Gi }, limits: { memory: 1Gi } }
---
apiVersion: v1
kind: Service
metadata: { name: elasticsearch, namespace: logging }
spec:
  selector: { app: elasticsearch }
  ports: [{ port: 9200 }]
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: kibana, namespace: logging }
spec:
  replicas: 1
  selector: { matchLabels: { app: kibana } }
  template:
    metadata: { labels: { app: kibana } }
    spec:
      containers:
        - name: kibana
          image: docker.elastic.co/kibana/kibana:8.19.0
          env:
            - { name: ELASTICSEARCH_HOSTS, value: "http://elasticsearch:9200" }
          ports: [{ containerPort: 5601 }]
          resources: { requests: { memory: 1Gi }, limits: { memory: 1Gi } }
---
apiVersion: v1
kind: Service
metadata: { name: kibana, namespace: logging }
spec:
  selector: { app: kibana }
  ports: [{ port: 5601 }]
